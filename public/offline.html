<!DOCTYPE html>
<html lang="id" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#102031">
    <meta name="google" content="notranslate">
    <title>Offline - Logistik Handayani</title>
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; background: #0b1725; color-scheme: dark; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
            color: #f8fafc;
            background:
                radial-gradient(circle at 20% 15%, rgba(245, 179, 1, .18), transparent 30%),
                radial-gradient(circle at 80% 85%, rgba(50, 196, 141, .12), transparent 32%),
                #0b1725;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 28rem);
            padding: clamp(1.5rem, 6vw, 2.25rem);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 1.75rem;
            background: rgba(16, 32, 49, .78);
            box-shadow: 0 28px 70px rgba(0, 0, 0, .36);
            text-align: center;
            backdrop-filter: blur(18px);
        }
        img { width: 5rem; height: 5rem; object-fit: contain; }
        h1 { margin: 1rem 0 .55rem; font-size: clamp(1.45rem, 7vw, 2rem); line-height: 1.15; }
        p { margin: 0; color: #b7c5d2; font-size: .9rem; line-height: 1.65; }
        button {
            width: 100%;
            min-height: 3rem;
            margin-top: 1.5rem;
            border: 0;
            border-radius: 1rem;
            color: #211807;
            background: linear-gradient(135deg, #f5b301, #ffd45a);
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/pwa/icon-192.png" alt="Logo Handayani" width="192" height="192">
        <h1>Koneksi terputus</h1>
        <p>Periksa koneksi internet Anda, lalu coba kembali untuk melanjutkan pengelolaan logistik.</p>
        <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
